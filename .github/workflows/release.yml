name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-gnu

jobs:
  build:
    name: Build (Windows x64, cross-compiled on Linux)
    # Pinned: `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19. Bump deliberately.
    runs-on: ubuntu-24.04
    # Healthy runs take ~1 min; anything past 15 min is a hung runner, not a slow one.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mingw-w64 (Windows cross linker)
        # Only step that depends on a third-party apt mirror; ~30s when healthy.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 zip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Build first: the installer include_bytes!()s p9ime.dll, which only
      # exists after a real build, and we want clippy to lint the full binary.
      - name: Build release
        run: cargo build --release

      - name: Clippy
        run: cargo clippy --all-targets --release -- -D warnings

      - name: Verify DLL exports
        run: |
          x86_64-w64-mingw32-objdump -p target/${TARGET}/release/p9ime.dll \
            | grep -E "DllCanUnloadNow|DllGetClassObject|DllRegisterServer|DllUnregisterServer"

      - name: Verify icon resource is linked
        # build.rs compiles assets/icon/p9ime.rc with windres and links it into
        # both the DLL (TSF / Installed Apps icon) and the installer (Explorer icon).
        run: |
          for f in p9ime.dll p9ime-installer.exe; do
            x86_64-w64-mingw32-objdump -h "target/${TARGET}/release/${f}" | grep -q '\.rsrc' \
              || { echo "${f}: missing .rsrc section (icon not linked)"; exit 1; }
            echo "${f}: .rsrc present"
          done

      - name: Verify installer embeds the DLL
        run: |
          DLL=target/${TARGET}/release/p9ime.dll
          EXE=target/${TARGET}/release/p9ime-installer.exe
          # Every MinGW PE carries the DOS-stub string at offset 78; the second
          # occurrence inside the installer is the embedded DLL's header.
          OFFSET=$(grep -obUaP 'This program cannot be run in DOS mode' "$EXE" \
                   | sed -n '2p' | cut -d: -f1)
          test -n "$OFFSET" || { echo "embedded DLL header not found"; exit 1; }
          cmp --ignore-initial=$((OFFSET - 78)):0 --bytes="$(stat -c%s "$DLL")" "$EXE" "$DLL"
          echo "p9ime.dll ($(stat -c%s "$DLL") bytes) embedded verbatim at offset $((OFFSET - 78))"

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          ASSET="p9ime-installer-${VERSION}-windows-x64.exe"
          mkdir -p dist
          cp "target/${TARGET}/release/p9ime-installer.exe" "dist/${ASSET}"
          (cd dist && sha256sum "${ASSET}" > "${ASSET}.sha256")
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.asset }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: P9IME ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
