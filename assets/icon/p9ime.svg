<?xml version="1.0" encoding="UTF-8"?>
<!--
  P9IME icon — master artwork (used for 32px and up).
  All geometry uses filled shapes (no stroke-only paths) so ImageMagick's
  built-in SVG renderer rasterizes every element with full fidelity.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 1. Outer rounded tile + metallic grey inset frame + recessed keycap face -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#181818"/>
  <rect x="14" y="14" width="228" height="228" rx="46" fill="#6e6e6e"/>
  <rect x="18" y="18" width="220" height="220" rx="42" fill="#202020"/>
  <!-- Top-lit bevel edge of inner platter -->
  <rect x="26" y="25" width="204" height="204" rx="34" fill="#4c4c4c"/>
  <rect x="26" y="28" width="204" height="203" rx="34" fill="#161616"/>
  <rect x="28" y="27" width="200" height="200" rx="32" fill="#2b2b2b"/>

  <!-- 2. Ornamental seal ring (R=90, r=85) centered at (128, 128) -->
  <path fill-rule="evenodd" fill="#686868"
        d="M128 38 A90 90 0 1 1 127.9 38 Z
           M128 43 A85 85 0 1 1 127.9 43 Z"/>

  <!-- Clean radial wedge knockouts (bounded within r<=98) for P and top-right star -->
  <!-- Top-left radial gap for upper P stem/bar -->
  <path d="M128 128 L45 80 L80 45 L123 32 Z" fill="#2b2b2b"/>
  <!-- Bottom-left radial gap for lower P foot -->
  <path d="M128 128 L123 224 L80 211 L45 176 Z" fill="#2b2b2b"/>
  <!-- Top-right radial gap for upper-right star -->
  <path d="M128 128 L178 44 L212 82 Z" fill="#2b2b2b"/>

  <!-- 3. Subtle corner accent diamonds inside all 4 corners of the platter -->
  <path d="M48 43 L53 48 L48 53 L43 48 Z" fill="#626262"/>
  <path d="M208 43 L213 48 L208 53 L203 48 Z" fill="#626262"/>
  <path d="M48 203 L53 208 L48 213 L43 208 Z" fill="#626262"/>
  <path d="M208 203 L213 208 L208 213 L203 208 Z" fill="#626262"/>

  <!-- 4. Decorative sparkles (four-point stars + diamond accents) -->
  <!-- Top-right star sitting cleanly inside the radial ring gap -->
  <path d="M192 52 L196 63 L207 67 L196 71 L192 82 L188 71 L177 67 L188 63 Z"
        fill="#dcdcdc"/>
  <!-- Primary four-point star in the open lower-right quadrant of the P -->
  <path d="M162 155 L167 169 L181 174 L167 179 L162 193 L157 179 L143 174 L157 169 Z"
        fill="#e8e8e8"/>
  <!-- Companion mid-right sparkle -->
  <path d="M192 134 L195 141 L202 144 L195 147 L192 154 L189 147 L182 144 L189 141 Z"
        fill="#b4b4b4"/>
  <!-- Lower-right diamond accent -->
  <path d="M130 190 L136 196 L130 202 L124 196 Z"
        fill="#9e9e9e"/>

  <!-- 5. Layered greyscale P monogram -->
  <!-- Dark drop shadow (+6, +7) -->
  <path fill-rule="evenodd" fill="#171717"
        d="M78 63 H142 A46 46 0 0 1 142 155 H110 V207 H78 Z
           M110 93 H142 A16 16 0 0 1 142 125 H110 Z"/>
  <!-- Mid-grey metallic bevel extrusion (+3, +3) -->
  <path fill-rule="evenodd" fill="#8e8e8e"
        d="M75 59 H139 A46 46 0 0 1 139 151 H107 V203 H75 Z
           M107 89 H139 A16 16 0 0 1 139 121 H107 Z"/>
  <!-- Main bright silver-white P face -->
  <path fill-rule="evenodd" fill="#f2f2f2"
        d="M72 56 H136 A46 46 0 0 1 136 148 H104 V200 H72 Z
           M104 86 H136 A16 16 0 0 1 136 118 H104 Z"/>
  <!-- Subtle engraved inline groove inside the vertical stem of P -->
  <rect x="85" y="70" width="6" height="116" rx="3" fill="#b8b8b8"/>
</svg>
