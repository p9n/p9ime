[package]
name = "p9ime"
version = "0.1.1"
edition = "2021"
description = "P9IME - Windows 10/11 Text Services Framework (TSF) IME and Installer in Rust"

[lib]
name = "p9ime"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "installer"
path = "src/bin/installer.rs"

[[bin]]
name = "uninstaller"
path = "src/bin/uninstaller.rs"

[dependencies]
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]
