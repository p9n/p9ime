[package]
name = "p9ime"
version = "0.1.2"
edition = "2021"
description = "P9IME - Windows 10/11 Text Services Framework (TSF) IME and Installer in Rust"

[lib]
name = "p9ime"
crate-type = ["cdylib", "rlib"]

# Single self-contained setup binary. It embeds p9ime.dll (see build.rs) and
# acts as the uninstaller when invoked with --uninstall or when its file name is
# uninstaller.exe (the installer copies itself under that name).
[[bin]]
name = "p9ime-installer"
path = "src/bin/installer/main.rs"

[features]
default = ["embed-dll"]
# Embed the compiled p9ime.dll into the installer via include_bytes!.
# `cargo check`/`clippy` never link the DLL, so disable this for lint-only runs:
#   cargo clippy --all-targets --no-default-features
embed-dll = []

[dependencies]
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]
